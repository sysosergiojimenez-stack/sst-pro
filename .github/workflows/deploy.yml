# Despliega sst-pro a Cloud Run cada vez que se mergea a main.
# Autenticacion por Workload Identity Federation (sin claves guardadas en GitHub).
# La configuracion de Google Cloud se hace una sola vez con scripts/setup-deploy-gcp.sh
name: Deploy a Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sg-sst-501720
  REGION: us-central1
  SERVICE: sst-pro
  IMAGE: us-central1-docker.pkg.dev/sg-sst-501720/sst-pro/sst-pro

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/516136641116/locations/global/workloadIdentityPools/github-actions/providers/sst-pro
          service_account: github-deployer@sg-sst-501720.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker con Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Construir imagen
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Subir imagen
        run: docker push "$IMAGE:${{ github.sha }}"

      # Solo cambia la imagen: el servicio conserva sus secretos, variables y puerto.
      - name: Desplegar
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --quiet
